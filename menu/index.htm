	<script>
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					colors: {
						primary: "#004d40",
						secondary: "#00796b",
						accent: "#4caf50",
						"background-light": "#f5f8f7",
						"background-dark": "#0f172a"
					},
					fontFamily: { display: ["Inter", "sans-serif"] }
				}
			}
		};
	</script>
	<style>
		body {
			font-family: "Inter",sans-serif
		}

		.portal-loading {
			min-height: 75vh;
			display: grid;
			place-items: center;
			color: #64748b;
			text-align: center
		}

			.portal-loading .material-icons {
				display: block;
				margin-bottom: .75rem;
				color: #00796b;
				font-size: 2rem;
				animation: spin 1.1s linear infinite
			}

			.portal-loading.error .material-icons {
				color: #b91c1c;
				animation: none
			}

		@keyframes spin {
			to {
				transform: rotate(360deg)
			}
		}
	</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 min-h-screen transition-colors duration-200">
	<main id="portal-host" aria-live="polite">
		<div class="portal-loading" id="portal-status">
			<div><span class="material-icons">progress_activity</span>Preparando módulos…</div>
		</div>
	</main>
